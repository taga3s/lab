name: CI

on:
  pull_request:
    paths:
      - .github/actions/node-echo/**
      - .github/workflows/ci_2.yaml

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - run: echo "${{ github.ref }}"
      - run: echo "${{ github.event.pull_request.base.sha }}"
      - run: |
          COMPARE_BASE_REF="origin/${GITHUB_BASE_REF}"
          COMPARE_BASE_SHA="$(git rev-parse --short "${COMPARE_BASE_REF}")"
          git diff --name-only $COMPARE_BASE_SHA HEAD
      - uses: ./.github/actions/node-echo
