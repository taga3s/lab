name: CI

on:
  pull_request:
    paths:
      - gha/deno-echo/**
      - .github/actions/deno-echo/**
      - .github/workflows/ci_1.yaml

jobs:
  ci:
    runs-on: ubuntu-slim

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: |
          COMPARE_BASE_REF="origin/${GITHUB_BASE_REF}"
          COMPARE_BASE_SHA="$(git rev-parse "${COMPARE_BASE_REF}")"
          echo $COMPARE_BASE_SHA
      - uses: ./.github/actions/deno-echo
        with:
          greeting: 'Hello, world!'
